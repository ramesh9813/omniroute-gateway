services:
  - type: web
    name: omniroute-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: REQUIRE_API_KEY
        value: "true"
      - key: OMNIROUTE_BUILD_BACKEND_ONLY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: CIRCLE_NODE_TOTAL
        value: "1"
      - key: OMNIROUTE_MEMORY_MB
        value: "512"
      - key: NEXT_PUBLIC_BASE_URL
        value: "https://omniroute-gateway-vcr9.onrender.com"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_PASSWORD
        generateValue: true
      - key: OMNIROUTE_WS_BRIDGE_SECRET
        generateValue: true
